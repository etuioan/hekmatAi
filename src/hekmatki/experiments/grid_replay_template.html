<meta charset="utf-8">
<title>HekmatKI Wiedergabe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: Kopf mit Fall-Auswahl und These, klebende Steuerleiste, gleich gebaute Agenten-Spalten, darunter die Zahlen aus 20 Läufen. */
:root {
  --bg: #f3f4f7;
  --surface: #ffffff;
  --ink: #161a24;
  --muted: #5b6275;
  --line: #d9dce5;
  --cell-gap: #1d2130;
  --accent: #0b6bcb;
  --good: #1f8a3b;
  --bad: #c2362b;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10131b; --surface: #181c27; --ink: #e9ecf3; --muted: #9aa2b6; --line: #2a3040;
    --cell-gap: #05070b; --accent: #5aa9f5; --good: #4cc26d; --bad: #f0705f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10131b; --surface: #181c27; --ink: #e9ecf3; --muted: #9aa2b6; --line: #2a3040;
  --cell-gap: #05070b; --accent: #5aa9f5; --good: #4cc26d; --bad: #f0705f; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.page { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
header { display: flex; flex-direction: column; gap: 8px; }
.eyebrow { font-family: var(--font-data); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(28px, 4.2vw, 44px); line-height: 1.05; margin: 0; text-wrap: balance; }
.lede { max-width: 68ch; margin: 0; color: var(--muted); }
.lede strong { color: var(--ink); font-weight: 600; }
.truth { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 13px; }
.truth label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; color: var(--muted); }
.controls {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding-block: 10px; border-bottom: 1px solid var(--line);
}
.controls button {
  font: 500 14px var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 12px; cursor: pointer; min-width: 44px;
}
.controls button.primary { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 96px; }
.controls button:focus-visible, .controls input:focus-visible, .truth input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.controls input[type="range"]#step { flex: 1 1 220px; min-width: 0; accent-color: var(--accent); }
.controls .readout { font-family: var(--font-data); font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); min-width: 11ch; }
.speed { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.speed select { font: 13px var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--line); }
.tabs button {
  font: 500 14px var(--font-body); color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent;
  padding: 8px 12px; margin-bottom: -1px; cursor: pointer; min-height: 44px;
}
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.agents { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 18px; }
.agent { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.agent h2 { font-family: var(--font-display); font-weight: 500; font-size: 21px; margin: 0; }
.agent .what { margin: 0; font-size: 13px; color: var(--muted); min-height: 3em; }
.board { position: relative; width: 100%; aspect-ratio: 1; max-width: 100%; border-radius: 4px; background: var(--cell-gap); outline: 3px solid transparent; outline-offset: 2px; transition: outline-color .15s; }
.board.won { outline-color: var(--good); }
.board.trapped { outline-color: var(--bad); }
.board.stopped { opacity: .45; }
.board canvas { width: 100%; height: 100%; display: block; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { display: flex; flex-direction: column; }
.stat span { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.stat b { font-family: var(--font-data); font-weight: 500; font-size: 18px; font-variant-numeric: tabular-nums; }
.doing { font-size: 14px; margin: 0; min-height: 2.6em; }
.doing .btn { font-family: var(--font-data); font-size: 12px; color: var(--muted); }
.doing.out { color: var(--bad); }
.color { display: inline-flex; gap: 4px; align-items: baseline; white-space: nowrap; }
.color .swatch { width: 11px; height: 11px; align-self: center; }
mark.contra { background: none; color: var(--bad); font-weight: 600; }
.beliefs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.beliefs li { display: flex; gap: 8px; align-items: baseline; }
.beliefs li > .swatch { align-self: center; }
.beliefs li.guess { color: var(--muted); font-style: italic; }
.swatch { width: 14px; height: 14px; border-radius: 2px; flex: none; border: 1px solid var(--line); }
.beliefs .empty { color: var(--muted); }
section.summary { display: flex; flex-direction: column; gap: 10px; }
section.summary h2 { font-family: var(--font-display); font-weight: 500; font-size: 22px; margin: 0; }
section.summary p { margin: 0; max-width: 68ch; color: var(--muted); font-size: 14px; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; font-size: 14px; min-width: 560px; width: 100%; }
th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; }
th { font-weight: 500; color: var(--muted); font-size: 12px; letter-spacing: .04em; }
td.best { font-weight: 600; color: var(--accent); }
tr.shown td:first-child::after { content: " ◀ oben"; color: var(--muted); font-size: 12px; }
@media (prefers-reduced-motion: reduce) { .board { transition: none; } }
</style>

<div class="page">
  <header>
    <p class="eyebrow">HekmatKI Prototyp 0.15 · 2D-Welt wie ARC-AGI-3</p>
    <div class="tabs" role="tablist" aria-label="Fall wählen" id="tabs"></div>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <div class="truth">
      <label for="show-truth"><input type="checkbox" id="show-truth"> Lösung zeigen</label>
      <span id="truth-legend" hidden></span>
    </div>
  </header>

  <div class="controls" role="group" aria-label="Wiedergabe steuern">
    <button type="button" class="primary" id="play">▶ Abspielen</button>
    <button type="button" id="back" aria-label="Einen Schritt zurück">◀</button>
    <button type="button" id="forward" aria-label="Einen Schritt vor">▶</button>
    <input type="range" id="step" min="0" value="0" aria-label="Schritt">
    <span class="readout" id="readout">Schritt 0</span>
    <label class="speed" for="speed">Tempo
      <select id="speed">
        <option value="2">langsam</option>
        <option value="6" selected>normal</option>
        <option value="16">schnell</option>
      </select>
    </label>
  </div>

  <div class="agents" id="agents"></div>

  <section class="summary">
    <h2>Über 20 Läufe gemittelt</h2>
    <p id="summary-note"></p>
    <div class="table-wrap"><table id="summary-table"></table></div>
  </section>
</div>

<script>
const DATA = /*REPLAY_DATA*/null;

const HEX = {
  "schwarz": "#000000", "blau": "#0074d9", "rot": "#ff4136", "grün": "#2ecc40", "gelb": "#ffdc00",
  "grau": "#aaaaaa", "pink": "#f012be", "orange": "#ff851b", "türkis": "#7fdbff", "braun": "#870c25"
};
const ABOUT = {
  "Bilder": "Lernt eine Tabelle von Bild zu Bild. Jede neue Position ist für ihn ein völlig neues Bild.",
  "Objekte": "Findet seine Figur, lernt die Tasten und was jede Farbe bewirkt. Das gilt sofort im ganzen Labyrinth.",
  "Objekte + Schema": "Wie in der Mitte, bringt aber Rollen mit („blockiert“, „auslöser“, „zurück“ …) und rät, welche neue Farbe welche Rolle hat.",
  "Objekte 0.12": "Der Objekt-Agent aus Version 0.12. Er kennt keine Kisten: Blockiert eine Farbe einmal und gibt dann nach, gibt er auf.",
  "Weltmodell": "Leitet Regeln aus seinen Beobachtungen ab, denkt in ihnen voraus und testet gezielt, was er nicht weiß. Widerspricht etwas, lernt er um.",
  "Weltmodell + Vorwissen": "Derselbe, mit seinem Modell aus den Leveln davor. Was davon hier nicht stimmt, findet er heraus und korrigiert es.",
  "ohne Vorwissen": "Der Weltmodell-Agent ohne jedes Vorwissen. Er lernt alles in diesem Level neu.",
  "Farben aus A": "Bringt sein Modell aus Spiel A mit, also Wissen über Farben. In den neuen Farben stimmt davon fast nichts mehr.",
  "Rollen aus A": "Bringt Regeln über Rollen mit („schiebbar“, „auslöser“ …). Eine Farbe bekommt eine Rolle erst, wenn alle passenden Deutungen übereinstimmen; die übrigen testet er.",
  "gleiches Spiel": "Dasselbe Labyrinth in den Farben von Spiel A, mit seinem Modell von dort. Der Bestwert, an dem sich die Übertragung misst.",
  "ohne, Aussehen A": "Der Weltmodell-Agent ohne Vorwissen, im selben Aussehen. Er probiert alles aus, auch die Kiste, und findet so heraus, dass die Platte hier das Tor schließt.",
  "Modell aus A": "Bringt sein Modell aus Spiel A mit und glaubt ihm. Die Kiste kennt er schon („schiebbar“), also probiert er sie lange nicht aus. Ohne sichtbare Platte findet er keinen Plan.",
  "Modell + Prüfung": "Nutzt das Modell aus A erst nach zwei Bestätigungen. Boden und Wand bestätigen es sofort; der Widerspruch an der Kiste kommt, wenn überhaupt, viel zu spät.",
  "Modell + Teilprüfung": "Nutzt das Modell aus A sofort. Steckt er fest, testet er jeden Teil, den er hier noch nicht selbst gesehen hat, auch die Kiste, und findet so den Weg."
};
const SCENARIOS = {
  fremd: {
    tab: "Tor umgekehrt (0.15)",
    title: "Wenn ein Spiel aussieht wie das alte, aber anders funktioniert",
    lede: "Alle Agenten sehen ein Level in den Farben von Spiel A. Doch hier <strong>schließt die Druckplatte das Tor</strong>, statt es zu öffnen, und die Kiste steht zu Beginn darauf: Man muss sie herunterschieben. <strong>Modell aus A</strong> glaubt seinem Vorwissen und probiert die Kiste lange nicht aus. <strong>Modell + Prüfung</strong> hilft das nicht, weil Boden und Wand das Vorwissen sofort bestätigen. <strong>Modell + Teilprüfung</strong> testet, sobald er feststeckt, alles, was er hier nicht selbst gesehen hat.",
    note: "Tastendrücke bis zum ersten Sieg, alle im Aussehen von Spiel A. „gewohnt“ hat die Regeln von A, bei „Eis“ rutscht die Figur (das schafft keiner). Kein Sieg in 300 Schritten zählt als 301."
  },
  farben: {
    tab: "Neue Farben (0.14)",
    title: "Wissen, das die Farbe wechselt",
    lede: "Alle vier Agenten haben vorher ein ganzes Spiel gespielt (Spiel A). Jetzt kommt ein Level aus einem <strong>neuen Spiel mit anderen Farben und anderen Tasten</strong>. <strong>Farben aus A</strong> glaubt seinem alten Farbwissen und verirrt sich. <strong>Rollen aus A</strong> hat Regeln über Rollen gelernt (schiebbar, auslöser, verschlossen …) und gibt einer neuen Farbe eine Rolle, sobald seine Beobachtungen nur noch eine Deutung zulassen. Ganz rechts zum Vergleich dasselbe Labyrinth in den Farben von Spiel A.",
    note: "Tastendrücke bis zum ersten Sieg im neuen Spiel. Alle Level haben eine Neustart-Taste wie ARC-AGI-3. Kein Sieg in 300 Schritten zählt als 301."
  },
  kisten: {
    tab: "Kisten-Rätsel",
    title: "Vier Agenten, ein Kisten-Rätsel",
    lede: "Ein Tor versperrt den Ausgang. Es ist nur offen, solange etwas auf der Druckplatte liegt, und die Figur kann nicht zugleich dort stehen und durchs Tor gehen: <strong>Sie muss eine Kiste auf die Platte schieben.</strong> Niemand sagt den Agenten, was Kiste, Platte oder Tor ist. Sie sehen nur Farben. Der <strong>Weltmodell</strong>-Agent leitet daraus Regeln ab und plant in ihnen. Der vierte ist derselbe, bringt aber sein Modell aus den vier Leveln davor mit.",
    note: "Tastendrücke bis zum ersten Sieg. Ein Spiel hat sechs Level mit denselben Farben und Tasten (wie in ARC-AGI-3), jedes Level ein neues Labyrinth. Kein Sieg in 300 Schritten zählt als 301."
  },
  tausch: {
    tab: "Vorwissen falsch",
    title: "Wenn das Vorwissen nicht mehr stimmt",
    lede: "Im letzten Level haben Ausgang und Falle die Farben getauscht. Der Agent <strong>mit Vorwissen</strong> läuft zuerst zielstrebig zur alten Ausgangsfarbe, landet wieder am Start und lernt um. Danach zweifelt er an allem, was er nur aus früheren Leveln weiß, prüft es gezielt und gewinnt trotzdem schneller als ohne Vorwissen. <strong>Rot markiert</strong>: wo eigene Beobachtung dem Vorwissen widerspricht.",
    note: "Tastendrücke bis zum ersten Sieg. Ein Spiel hat sechs Level mit denselben Farben und Tasten (wie in ARC-AGI-3), jedes Level ein neues Labyrinth. Kein Sieg in 300 Schritten zählt als 301."
  },
  labyrinth: {
    tab: "Labyrinth (0.12)",
    title: "Drei Agenten, ein unbekanntes Labyrinth",
    lede: "Der Fall aus Version 0.12. Jeder Agent sieht nur das Farbraster. Er weiß nicht, welche Farbe er selbst ist, welche Taste wohin geht oder was Schlüssel und Tür sind. <strong>Links</strong> der alte Ansatz, der jedes Bild als eigenen Zustand lernt. <strong>In der Mitte</strong> der Objekt-Agent, der über Farben lernt. <strong>Rechts</strong> derselbe mit Rollen aus drei früheren Leveln, die ganz andere Farben hatten.",
    note: "Tastendrücke bis zum ersten Sieg. Jedes Level hat neue Farben, neue Tastennamen und ein neues Labyrinth. Level 1 bis 3 sind Training für das Rollen-Schema."
  }
};
const COLOR_WORD = new RegExp(`(?<![a-zäöüß])(${Object.keys(HEX).join("|")})(?![a-zäöüß])`, "g");

const els = {};
const state = { t: 0, playing: false, timer: null, scenario: null, replay: null, last: 0 };

function cumulative(frames, key) {
  const out = [0];
  frames.forEach((f, i) => out.push(out[i] + (f[key] ? 1 : 0)));
  return out;
}

function escapeHtml(text) {
  return text.replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]);
}

function swatch(color) {
  return `<span class="swatch" style="background:${HEX[color]}"></span>`;
}

function colorize(text) {
  return escapeHtml(text)
    .replace(COLOR_WORD, word => `<span class="color">${swatch(word)}${word}</span>`)
    .replace(/\(Vorwissen: ([^)]*)\)/g, (_, old) => `<mark class="contra">(Vorwissen: ${old})</mark>`);
}

function buildTabs() {
  const host = document.getElementById("tabs");
  DATA.scenarios.forEach(scenario => {
    const button = document.createElement("button");
    button.type = "button";
    button.role = "tab";
    button.id = `tab-${scenario.id}`;
    button.textContent = SCENARIOS[scenario.id]?.tab ?? scenario.id;
    button.addEventListener("click", () => choose(scenario));
    host.appendChild(button);
  });
  host.addEventListener("keydown", e => {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    e.preventDefault();
    e.stopPropagation();
    const index = DATA.scenarios.indexOf(state.scenario);
    const next = (index + (e.key === "ArrowRight" ? 1 : -1) + DATA.scenarios.length) % DATA.scenarios.length;
    choose(DATA.scenarios[next]);
    document.getElementById(`tab-${DATA.scenarios[next].id}`).focus();
  });
}

function choose(scenario) {
  setPlaying(false);
  state.scenario = scenario;
  state.replay = scenario.replay;
  state.last = Math.max(...state.replay.agents.map(a => a.frames.length - 1));
  state.t = 0;
  const text = SCENARIOS[scenario.id] ?? { title: scenario.id, lede: "", note: "" };
  document.getElementById("title").textContent = text.title;
  document.getElementById("lede").innerHTML = text.lede;
  DATA.scenarios.forEach(other => {
    const tab = document.getElementById(`tab-${other.id}`);
    tab.setAttribute("aria-selected", String(other === scenario));
    tab.tabIndex = other === scenario ? 0 : -1;
  });
  try { localStorage.setItem("hekmatki-scenario", scenario.id); } catch (e) { /* ohne Speicher geht es auch */ }
  els.step.max = state.last;
  buildAgents();
  buildTruth();
  buildSummary(text.note);
  render();
}

function buildAgents() {
  const host = document.getElementById("agents");
  host.innerHTML = "";
  state.replay.agents.forEach((agent, index) => {
    agent.winsUpTo = cumulative(agent.frames, "won");
    agent.trapsUpTo = cumulative(agent.frames, "trapped");
    const col = document.createElement("article");
    col.className = "agent";
    col.innerHTML = `
      <h2>${agent.name}</h2>
      <p class="what">${ABOUT[agent.name] ?? ""}</p>
      <div class="board" id="board-${index}"><canvas id="canvas-${index}" aria-label="Spielfeld ${agent.name}" role="img"></canvas></div>
      <div class="stats">
        <div class="stat"><span>Siege</span><b id="wins-${index}">0</b></div>
        <div class="stat"><span>Fallen</span><b id="traps-${index}">0</b></div>
        <div class="stat"><span>1. Sieg nach</span><b id="first-${index}">–</b></div>
      </div>
      <p class="doing" id="doing-${index}"></p>
      <ul class="beliefs" id="beliefs-${index}"></ul>`;
    host.appendChild(col);
  });
}

function drawGrid(canvas, rows) {
  const size = canvas.getBoundingClientRect().width;
  if (!size) return;
  const ratio = window.devicePixelRatio || 1;
  canvas.width = Math.round(size * ratio);
  canvas.height = Math.round(size * ratio);
  const ctx = canvas.getContext("2d");
  const n = rows.length;
  const cell = canvas.width / n;
  const gap = Math.max(1, Math.round(ratio));
  const palette = state.replay.palette;
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--cell-gap").trim() || "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  rows.forEach((row, r) => {
    [...row].forEach((digit, c) => {
      ctx.fillStyle = HEX[palette[Number(digit)]];
      ctx.fillRect(Math.round(c * cell) + gap, Math.round(r * cell) + gap, Math.ceil(cell) - 2 * gap, Math.ceil(cell) - 2 * gap);
    });
  });
}

function renderBeliefs(list, beliefs, agentName) {
  const entries = Object.entries(beliefs);
  if (!entries.length) {
    list.innerHTML = agentName === "Bilder"
      ? `<li class="empty">Kennt keine Farben, nur ganze Bilder.</li>`
      : `<li class="empty">Weiß noch nichts über die Farben.</li>`;
    return;
  }
  entries.sort((a, b) => a[1].startsWith("vermutlich") - b[1].startsWith("vermutlich"));
  list.innerHTML = entries.map(([color, text]) => {
    const guess = text.startsWith("vermutlich");
    return `<li class="${guess ? "guess" : ""}">${swatch(color)}<span>${color}: ${colorize(text)}</span></li>`;
  }).join("");
}

function ending(agent) {
  const steps = agent.frames.length - 1;
  if (agent.stopped) return `Ausgeschieden nach ${steps} Schritten: ${agent.stopped}`;
  return `Ende: ${agent.wins} Siege, ${agent.traps} × in eine Falle getreten.`;
}

function render() {
  const t = state.t;
  els.step.value = t;
  els.readout.textContent = `Schritt ${t} / ${state.last}`;
  state.replay.agents.forEach((agent, index) => {
    const i = Math.min(t, agent.frames.length - 1);
    const frame = agent.frames[i];
    drawGrid(document.getElementById(`canvas-${index}`), frame.grid);
    const previous = i > 0 ? agent.frames[i - 1] : null;
    const board = document.getElementById(`board-${index}`);
    const out = Boolean(agent.stopped) && !frame.button;
    board.classList.toggle("won", Boolean(previous && previous.won));
    board.classList.toggle("trapped", Boolean(previous && previous.trapped));
    board.classList.toggle("stopped", out);
    document.getElementById(`wins-${index}`).textContent = agent.winsUpTo[i];
    document.getElementById(`traps-${index}`).textContent = agent.trapsUpTo[i];
    const first = agent.firstWin !== null && agent.firstWin <= i ? String(agent.firstWin) : "–";
    document.getElementById(`first-${index}`).textContent = first;
    const doing = document.getElementById(`doing-${index}`);
    doing.classList.toggle("out", out);
    doing.innerHTML = frame.button
      ? `${colorize(frame.reason)} <span class="btn">(${escapeHtml(frame.button)})</span>`
      : colorize(ending(agent));
    renderBeliefs(document.getElementById(`beliefs-${index}`), frame.beliefs, agent.name);
  });
}

function setPlaying(on) {
  state.playing = on;
  els.play.textContent = on ? "❚❚ Pause" : "▶ Abspielen";
  clearInterval(state.timer);
  if (on) {
    if (state.t >= state.last) state.t = 0;
    state.timer = setInterval(() => {
      if (state.t >= state.last) { setPlaying(false); return; }
      state.t += 1;
      render();
    }, 1000 / Number(els.speed.value));
  }
}

function go(t) {
  state.t = Math.max(0, Math.min(state.last, t));
  render();
}

function buildTruth() {
  const legend = document.getElementById("truth-legend");
  legend.innerHTML = Object.entries(state.replay.truth)
    .map(([tile, color]) => `<span style="display:inline-flex;gap:6px;align-items:center">${swatch(color)}${tile}</span>`)
    .join("");
}

function buildSummary(note) {
  const rows = state.scenario.summary;
  const replay = state.replay;
  const learners = replay.agents.map(a => a.name);
  const number = v => v.toFixed(1).replace(".", ",");
  const head = `<tr><th>Level</th><th>Größe</th>${learners.map(l => `<th>${l}</th>`).join("")}<th>bestenfalls</th></tr>`;
  const body = rows.map(row => {
    const values = learners.map(l => row.firstWin[l]);
    const best = Math.min(...values);
    const cells = values.map(v => `<td class="${v === best ? "best" : ""}">${number(v)}</td>`).join("");
    const shown = row.level === replay.level ? "shown" : "";
    return `<tr class="${shown}"><td>${row.level}</td><td>${row.size}</td>${cells}<td>${number(row.optimal)}</td></tr>`;
  }).join("");
  document.getElementById("summary-table").innerHTML = `<thead>${head}</thead><tbody>${body}</tbody>`;
  document.getElementById("summary-note").textContent =
    `${note} Die Wiedergabe oben zeigt Level „${replay.level}“ (${replay.size} Felder) aus Lauf ${replay.seed}.`;
}

function start() {
  ["play", "back", "forward", "step", "readout", "speed"].forEach(id => { els[id] = document.getElementById(id); });
  buildTabs();
  document.getElementById("show-truth").addEventListener("change", e => {
    document.getElementById("truth-legend").hidden = !e.target.checked;
  });
  els.play.addEventListener("click", () => setPlaying(!state.playing));
  els.back.addEventListener("click", () => { setPlaying(false); go(state.t - 1); });
  els.forward.addEventListener("click", () => { setPlaying(false); go(state.t + 1); });
  els.step.addEventListener("input", () => { setPlaying(false); go(Number(els.step.value)); });
  els.speed.addEventListener("change", () => { if (state.playing) setPlaying(true); });
  document.addEventListener("keydown", e => {
    if (e.target.closest && e.target.closest("input, select, [role=tablist]")) return;
    if (e.key === " ") { e.preventDefault(); setPlaying(!state.playing); }
    if (e.key === "ArrowRight") go(state.t + 1);
    if (e.key === "ArrowLeft") go(state.t - 1);
  });
  window.addEventListener("resize", render);
  let saved = null;
  try { saved = localStorage.getItem("hekmatki-scenario"); } catch (e) { /* ohne Speicher geht es auch */ }
  choose(DATA.scenarios.find(s => s.id === saved) ?? DATA.scenarios[0]);
}

start();
</script>
