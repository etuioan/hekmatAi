[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hekmatki"
version = "0.20.0"
description = "HekmatKI Prototyp: Schema-Stapel, Kontextwechsel, 2D-Welt wie ARC-AGI-3 und ein Weltmodell über Rollen"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5"]
crafter = ["crafter>=1.8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["crafter", "numpy"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "ANN", "PT", "RET"]
# Deutsche Texte nutzen typografische Anführungszeichen und Gedankenstriche.
ignore = ["RUF001", "RUF002", "RUF003"]
